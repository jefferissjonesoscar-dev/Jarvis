<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04080f;
    --panel: rgba(10, 24, 40, 0.72);
    --line: rgba(64, 200, 255, 0.22);
    --cyan: #3fd2ff;
    --cyan-soft: rgba(63, 210, 255, 0.14);
    --gold: #ffb84d;
    --text: #d8f3ff;
    --muted: #7fa6bd;
    --you: rgba(255, 184, 77, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(30, 120, 200, 0.18), transparent 60%),
      linear-gradient(rgba(63, 210, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63, 210, 255, 0.04) 1px, transparent 1px);
    background-size: auto, 40px 40px, 40px 40px;
    color: var(--text);
    font-family: "Rajdhani", "Segoe UI", sans-serif;
    font-size: 18px;
    overflow: hidden;
  }
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    padding: 20px;
    max-width: 1300px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(6px);
    position: relative;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-color: var(--cyan); border-style: solid;
  }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 14px 0 0 0; }
  .panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 14px 0; }

  /* Left: reactor and status */
  .side { display: flex; flex-direction: column; align-items: center; padding: 26px 22px; gap: 18px; }
  h1 {
    font-family: "Orbitron", sans-serif; font-weight: 700; letter-spacing: 0.35em;
    font-size: 26px; margin: 0; color: var(--cyan); text-shadow: 0 0 14px rgba(63, 210, 255, 0.6);
  }
  .sub { color: var(--muted); font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; margin-top: -10px; }
  .reactor { width: 220px; height: 220px; position: relative; }
  .reactor svg { width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; stroke: var(--cyan); transform-origin: 110px 110px; }
  .r1 { stroke-width: 2; stroke-dasharray: 40 14; opacity: .8; animation: spin 18s linear infinite; }
  .r2 { stroke-width: 6; stroke-dasharray: 3 9; opacity: .55; animation: spin 10s linear infinite reverse; }
  .r3 { stroke-width: 1.5; stroke-dasharray: 120 30 10 30; opacity: .9; animation: spin 6s linear infinite; }
  .core { fill: url(#coreGlow); transform-origin: 110px 110px; animation: breathe 3.2s ease-in-out infinite; }
  .busy .r1 { animation-duration: 3s; } .busy .r2 { animation-duration: 1.8s; } .busy .r3 { animation-duration: 1.2s; }
  .busy .core { animation-duration: .9s; }
  .speaking .core { animation-duration: .45s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(.92); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
  .state {
    font-family: "Orbitron", sans-serif; font-size: 13px; letter-spacing: .25em; color: var(--cyan);
    text-transform: uppercase; min-height: 1em;
  }
  .stats { width: 100%; display: grid; gap: 8px; }
  .stat {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 15px;
  }
  .stat span:first-child { color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
  .stat b { font-weight: 600; text-align: right; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dot.on { background: #4dffa6; box-shadow: 0 0 8px #4dffa6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--cyan-soft); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(63, 210, 255, .3); }

  /* Right: chat */
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat-head {
    display: flex; justify-content: space-between; align-items: center; padding: 14px 20px;
    border-bottom: 1px solid var(--line); font-family: "Orbitron", sans-serif; font-size: 12px;
    letter-spacing: .25em; color: var(--muted);
  }
  .log { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .log::-webkit-scrollbar { width: 6px; } .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg .who { display: block; font-family: "Orbitron", sans-serif; font-size: 10px; letter-spacing: .25em; margin-bottom: 4px; opacity: .75; }
  .msg.jarvis { align-self: flex-start; background: var(--cyan-soft); border: 1px solid var(--line); border-left: 3px solid var(--cyan); }
  .msg.jarvis .who { color: var(--cyan); }
  .msg.you { align-self: flex-end; background: var(--you); border: 1px solid rgba(255, 184, 77, .3); border-right: 3px solid var(--gold); }
  .msg.you .who { color: var(--gold); }
  .msg.ask { border-left-color: var(--gold); }
  .msg.error { border-left-color: #ff5c7a; }
  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); }
  #input {
    flex: 1; min-width: 0; background: rgba(0, 0, 0, .35); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font: inherit; outline: none; transition: .15s;
  }
  #input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(63, 210, 255, .15); }
  .btn {
    background: transparent; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 10px;
    width: 48px; height: 48px; display: grid; place-items: center; cursor: pointer; flex: none; transition: .15s;
  }
  .btn:hover { background: var(--cyan-soft); box-shadow: 0 0 12px rgba(63, 210, 255, .35); }
  .btn.send { background: var(--cyan); color: #02121c; }
  .btn.live { background: #ff5c7a; border-color: #ff5c7a; color: #fff; animation: breathe 1s infinite; }
  .btn.off { opacity: .45; }
  .btn svg { width: 22px; height: 22px; }
  .toggle { white-space: nowrap; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; letter-spacing: .1em; cursor: pointer; }
  .voicebar { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .voicepick {
    max-width: 190px; background: rgba(0, 0, 0, .35); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; letter-spacing: 0; cursor: pointer;
  }
  .voicepick option { background: #0a1828; }
  .toggle.on { color: var(--cyan); border-color: var(--cyan); }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; height: auto; min-height: 100%; padding: 16px; }
    .side { padding: 18px 16px; }
    .reactor { width: 140px; height: 140px; }
    .stats { display: none; }
    .chat { height: 70vh; }
    .msg { max-width: 92%; }
    .chat-head > span:first-child { display: none; }
    .voicepick { max-width: 150px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel side">
    <h1>JARVIS</h1>
    <div class="sub">Personal assistant</div>
    <div class="reactor" id="reactor">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <defs>
          <radialGradient id="coreGlow">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#9eeaff"/>
            <stop offset="70%" stop-color="#3fd2ff" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#3fd2ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="ring r1" cx="110" cy="110" r="100"/>
        <circle class="ring r2" cx="110" cy="110" r="80"/>
        <circle class="ring r3" cx="110" cy="110" r="62"/>
        <circle class="core" cx="110" cy="110" r="44"/>
      </svg>
    </div>
    <div class="state" id="state">Online</div>
    <div class="stats">
      <div class="stat"><span>Brain</span><b id="brain"><span class="dot"></span>…</b></div>
      <div class="stat"><span>Time</span><b id="clock">--:--</b></div>
      <div class="stat"><span>Date</span><b id="date">…</b></div>
    </div>
    <div class="chips">
      <button class="chip" data-say="What time is it?">Time</button>
      <button class="chip" data-say="calculate 240 * 0.15">Calculate</button>
      <button class="chip" data-say="list my notes">My notes</button>
      <button class="chip" data-say="ask me something">Ask me</button>
    </div>
  </aside>

  <main class="panel chat">
    <div class="chat-head">
      <span>Secure channel · this computer only</span>
      <span class="voicebar">
        <select id="voicePick" class="voicepick" title="Jarvis's voice" hidden></select>
        <button class="toggle" id="voiceToggle" title="Jarvis reads replies out loud">VOICE OFF</button>
      </span>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <button type="button" class="btn" id="mic" title="Talk (Chrome or Edge)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <input id="input" placeholder="Talk to Jarvis…" maxlength="4000">
      <button class="btn send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), reactor = $("reactor"), state = $("state");
let busy = false, waitingAnswer = false;
let voiceOn = false;
try { voiceOn = localStorage.getItem("jarvis-voice") === "on"; } catch (e) {}

function setState(text, cls) {
  state.textContent = text;
  reactor.classList.remove("busy", "speaking");
  if (cls) reactor.classList.add(cls);
}

function add(kind, text, extra) {
  const div = document.createElement("div");
  div.className = "msg " + kind + (extra ? " " + extra : "");
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = kind === "you" ? "YOU" : "JARVIS";
  div.appendChild(who);
  const body = document.createElement("span");
  if (text === null) body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  else body.textContent = text;
  div.appendChild(body);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// Voices. Jarvis's own natural voices come from the server (voice.py), so they
// sound the same in every browser. The browser's built-in voices are the backup.
let voices = [];            // browser voices, most human-sounding first
let serverVoices = [];      // Jarvis's own voices, from /api/status
let chosenVoice = "";       // "srv:<id>" or "web:<name>"
let audio = null, warnedVoice = false;
try { chosenVoice = localStorage.getItem("jarvis-voice-choice") || ""; } catch (e) {}

function voiceScore(v) {
  const n = v.name;
  let score = 0;
  if (/natural/i.test(n)) score += 100;
  if (/online/i.test(n)) score += 20;
  if (/^google/i.test(n)) score += 60;
  if (/en-GB/i.test(v.lang)) score += 8;
  if (/ryan|thomas|george|brian|daniel|guy|christopher|eric|andrew/i.test(n)) score += 4;
  return score;
}
function loadVoices() {
  if ("speechSynthesis" in window) {
    voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang))
      .sort((a, b) => voiceScore(b) - voiceScore(a));
  }
  const pick = $("voicePick");
  pick.innerHTML = "";
  const group = (label, items) => {
    if (!items.length) return;
    const g = document.createElement("optgroup");
    g.label = label;
    items.forEach(([value, text]) => {
      const o = document.createElement("option");
      o.value = value; o.textContent = text; g.appendChild(o);
    });
    pick.appendChild(g);
  };
  group("Jarvis voices (natural)", serverVoices.map(v => ["srv:" + v.id, v.label]));
  group("Browser voices", voices.map(v => ["web:" + v.name,
    v.name.replace(/^Microsoft /, "").replace(/ - .*$/, "").replace(/ Online \(Natural\)/, " (natural)")]));
  const values = Array.from(pick.options).map(o => o.value);
  if (!values.includes(chosenVoice)) chosenVoice = values[0] || "";
  pick.value = chosenVoice;
  pick.hidden = values.length === 0;
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = loadVoices;

function stopSpeaking() {
  if (audio) { audio.pause(); audio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function doneSpeaking() { setState(waitingAnswer ? "Awaiting your answer" : "Online"); }

function speakWithBrowser(text, name) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.name === name) || voices[0];
  if (v) { u.voice = v; u.lang = v.lang; }
  const natural = v && voiceScore(v) >= 60;
  u.rate = natural ? 1.0 : 0.95;
  u.pitch = natural ? 1.0 : 0.95;
  u.onstart = () => setState("Speaking", "speaking");
  u.onend = doneSpeaking;
  speechSynthesis.speak(u);
}

async function speak(text, force) {
  if ((!voiceOn && !force) || !text) return;
  stopSpeaking();
  if (chosenVoice.startsWith("srv:")) {
    try {
      const res = await fetch("/api/speak", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice: chosenVoice.slice(4) })
      });
      if (!res.ok) throw new Error((await res.json()).error || res.status);
      const url = URL.createObjectURL(await res.blob());
      audio = new Audio(url);
      audio.onplay = () => setState("Speaking", "speaking");
      audio.onended = () => { URL.revokeObjectURL(url); doneSpeaking(); };
      await audio.play();
      return;
    } catch (e) {
      if (!warnedVoice) {
        warnedVoice = true;
        add("jarvis", "My natural voice isn't working right now (" + e.message + "), so I'm using the browser's voice. It needs internet, and edge-tts installed: run Start Jarvis.bat again to install it.", "error");
      }
    }
  }
  speakWithBrowser(text, chosenVoice.startsWith("web:") ? chosenVoice.slice(4) : "");
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  add("you", text);
  input.value = "";
  const pending = add("jarvis", null);
  setState("Thinking", "busy");
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    pending.remove();
    waitingAnswer = data.type === "ask";
    add("jarvis", data.text || data.error || "…", data.type === "ask" ? "ask" : data.type === "error" ? "error" : "");
    setState(waitingAnswer ? "Awaiting your answer" : "Online");
    speak(data.text || "");
  } catch (e) {
    pending.remove();
    add("jarvis", "I can't reach my core. Is Jarvis still running in VS Code?", "error");
    setState("Offline");
  } finally {
    busy = false;
    input.focus();
  }
}

$("form").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => send(c.dataset.say)));

const vt = $("voiceToggle");
function paintVoice() { vt.textContent = voiceOn ? "VOICE ON" : "VOICE OFF"; vt.classList.toggle("on", voiceOn); }
vt.addEventListener("click", () => {
  voiceOn = !voiceOn; paintVoice();
  try { localStorage.setItem("jarvis-voice", voiceOn ? "on" : "off"); } catch (e) {}
  if (voiceOn) speak("Voice on. I'll read my replies out loud.");
  else stopSpeaking();
});
paintVoice();

// Talk to Jarvis with your microphone (Chrome and Edge support this).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("mic");
const MIC_ERRORS = {
  "not-allowed": "Your browser blocked the microphone. Click the lock or camera icon at the left of the address bar, set Microphone to Allow, then reload the page.",
  "service-not-allowed": "Your browser blocked the microphone. Click the lock icon at the left of the address bar, set Microphone to Allow, then reload the page.",
  "audio-capture": "I can't find a microphone. Check one is plugged in and chosen in Windows sound settings.",
  "network": "Voice typing needs an internet connection, and only works in Google Chrome or Microsoft Edge (not Brave or Opera).",
  "no-speech": "I didn't hear anything. Click the microphone and speak straight away."
};
if (!SR) {
  mic.classList.add("off");
  mic.title = "Voice input needs Chrome or Edge";
  mic.addEventListener("click", () => add("jarvis",
    "This browser can't do voice input. Open http://" + location.host + " in Google Chrome or Microsoft Edge to talk to me.", "error"));
} else {
  const rec = new SR();
  rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = false;
  let listening = false, heard = "";
  rec.onstart = () => { listening = true; heard = ""; mic.classList.add("live"); setState("Listening", "busy"); };
  rec.onresult = e => {
    heard = Array.from(e.results).map(r => r[0].transcript).join("");
    input.value = heard;
  };
  rec.onerror = e => { if (e.error !== "aborted") add("jarvis", MIC_ERRORS[e.error] || ("Voice input stopped: " + e.error), "error"); };
  rec.onend = () => {
    listening = false; mic.classList.remove("live");
    if (!busy) setState(waitingAnswer ? "Awaiting your answer" : "Online");
    if (heard.trim()) send(heard);
  };
  mic.addEventListener("click", () => {
    if (listening) { rec.stop(); return; }
    stopSpeaking();
    try { rec.start(); } catch (err) { add("jarvis", "The microphone is busy. Wait a second and try again.", "error"); }
  });
}

$("voicePick").addEventListener("change", e => {
  chosenVoice = e.target.value;
  try { localStorage.setItem("jarvis-voice-choice", chosenVoice); } catch (err) {}
  speak("Hello, this is how I sound now.", true);
});

function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
}
tick(); setInterval(tick, 10000);

fetch("/api/status").then(r => r.json()).then(s => {
  serverVoices = s.tts ? (s.voices || []) : [];
  loadVoices();
  const on = !/offline/i.test(s.brain);
  $("brain").innerHTML = `<span class="dot${on ? " on" : ""}"></span>`;
  $("brain").append(on ? s.brain.replace(/^Claude \((.*)\)$/, "Claude · $1") : "Offline mode");
  const hello = on ? "Good to see you. How can I help?"
    : "Hello. I'm running in offline mode, so I only know a few tricks. Add your Claude key to wake me up properly.";
  add("jarvis", hello);
}).catch(() => add("jarvis", "I can't reach my core. Is Jarvis still running in VS Code?", "error"));
input.focus();
</script>
</body>
</html>
